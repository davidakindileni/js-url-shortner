<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS URl Shortner</title>
    <meta name="description" content="A Program that Shortens URLs adn stores it">
    <meta name="author" content="Akinsola David Akindileni">
    <link rel="icon" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
</head>

<body>
    <h1>URL Shortner</h1>
    <main>
        <label for="longUrl">Enter the long URL: </label>
        <input type="text" id="longUrl" placeholder="Enter long URL">
        <label for="shortUrl">Short URL: </label>
        <input type="text" id="shortUrl" readonly>
        <p class="readOnly">(Read Only)</p>
        <div class="btnSet">
            <button id="shortenBtn" type="button">Shorten</button>
            <!-- <button id="findBtn" type="button">Find</button> -->
            <button id="delBtn" type="button" disable>Delete</button>
            <!-- <button id="exitBtn" type="button">Exit</button> -->
        </div>
        <div class="urlListHdr">
            <h3>Stored URLs:</h3>
            <button id="delAllUrls" type="button">Delete All URLs</button>
        </div>
        <hr>
        <ul id="urlList"></ul>
        <!-- <button aria-label="Close" id="close-button">❌</button> -->
    </main>
    <script type="module" src="app.js" defer></script>
</body>
</html>
